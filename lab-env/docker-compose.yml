version: '3.8'

services:
  teamserver:
    build:
      context: ../teamserver
      dockerfile: Dockerfile
    container_name: c2_teamserver
    ports:
      - "${TEAMSERVER_PORT:-8000}:8000"
    networks:
      - c2_network

  victim_linux_alpha:
    image: python:3.11-slim
    container_name: victim_alpha
    volumes:
      - ../agent:/opt/agent
    working_dir: /opt/agent
    command: /bin/bash -c "pip install --quiet requests psutil && python agent.py"
    environment:
      - SERVER_URL=http://teamserver:8000
      - CHECKIN_INTERVAL=${CHECKIN_INTERVAL:-5}
    depends_on:
      - teamserver
    networks:
      - c2_network

  victim_linux_bravo:
    image: python:3.11-slim
    container_name: victim_bravo
    volumes:
      - ../agent:/opt/agent
    working_dir: /opt/agent
    command: /bin/bash -c "pip install --quiet requests psutil && python agent.py"
    environment:
      - SERVER_URL=http://teamserver:8000
      - CHECKIN_INTERVAL=${CHECKIN_INTERVAL:-5}
    depends_on:
      - teamserver
    networks:
      - c2_network

networks:
  c2_network:
    driver: bridge
